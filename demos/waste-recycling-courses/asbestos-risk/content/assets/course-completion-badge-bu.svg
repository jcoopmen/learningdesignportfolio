<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ccb-title ccb-desc"><title id="ccb-title">Course completion medallion for burgundy backgrounds</title><desc id="ccb-desc">A circular completion badge designed to sit on a burgundy background. A four segment progress ring in pale pink, light red, coral and amber closes the full circle, meeting at the top in a cream disc containing a burgundy tick. Inside the ring is a line drawing of a certificate: two stacked sheets in cream and dusty pink with a ruled heading, three lines of text and a scalloped award seal at the lower right. Below the certificate is the heading &quot;Course Complete&quot; in white with a hand drawn underline, then the label &quot;COURSE PROGRESS&quot; and the figure &quot;100%&quot; in amber.</desc><defs><style type="text/css">@import url(&apos;https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&amp;display=swap&apos;);
      .t { font-family: &apos;Poppins&apos;, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif; }
      .title   { font-size: 46px; font-weight: 700; fill: #ffffff; letter-spacing: -0.4px; }
      .kicker  { font-size: 14px; font-weight: 600; fill: #F4E1EC; letter-spacing: 2.1px; }
      .numeral { font-size: 66px; font-weight: 700; fill: #f59f2a; letter-spacing: -1px; }</style></defs><!--layered echo: concentric outlines bleeding off the corners--><g fill="none" stroke="#F4E1EC" stroke-linecap="round"><circle cx="450" cy="450" r="520" stroke-width="2" opacity="0.22"/><circle cx="450" cy="450" r="558" stroke-width="1.5" opacity="0.14"/></g><!--dotted halo defining the interior--><circle cx="450" cy="450" r="332" fill="none" stroke="#F4E1EC" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.5 16" opacity="0.75"/><!--progress ring: four segments, closed at the top--><g fill="none" stroke-width="26" stroke-linecap="round"><path d="M 533.2 89.5 A 370 370 0 0 1 820.0 453.2" stroke="#E6A7CA"/><path d="M 815.9 504.7 A 370 370 0 0 1 475.8 819.1" stroke="#EB6684"/><path d="M 424.2 819.1 A 370 370 0 0 1 84.1 504.7" stroke="#F37049"/><path d="M 80.0 453.2 A 370 370 0 0 1 366.8 89.5" stroke="#f59f2a"/></g><!--completion marker closing the ring--><circle cx="450" cy="80" r="52" fill="#f5e9ee"/><path d="M 426 81 L 442 98 L 476 59" fill="none" stroke="#7a194f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><!--certificate--><g stroke="#5e1240" stroke-linejoin="round" stroke-linecap="round"><rect x="318" y="228" width="248" height="168" rx="5" fill="#E6A7CA" stroke-width="4.5" transform="rotate(-5 442 312)"/><rect x="334" y="240" width="248" height="168" rx="5" fill="#f5e9ee" stroke-width="4.5"/><rect x="348" y="254" width="220" height="140" rx="2" fill="none" stroke="#DE5EA5" stroke-width="2.5"/><path d="M 366 284 L 552 284" fill="none" stroke-width="8"/><g stroke="#DE5EA5" stroke-width="5.5" fill="none"><path d="M 366 316 L 552 316"/><path d="M 366 344 L 500 344"/><path d="M 366 372 L 492 372"/></g><path d="M 552 344 L 559.4 352.5 L 570 348.8 L 572.2 359.8 L 583.2 362 L 579.5 372.6 L 588 380 L 579.5 387.4 L 583.2 398 L 572.2 400.2 L 570 411.2 L 559.4 407.5 L 552 416 L 544.6 407.5 L 534 411.2 L 531.8 400.2 L 520.8 398 L 524.5 387.4 L 516 380 L 524.5 372.6 L 520.8 362 L 531.8 359.8 L 534 348.8 L 544.6 352.5 Z" fill="#E6A7CA" stroke-width="4"/><circle cx="552" cy="380" r="27" fill="#f5e9ee" stroke-width="4"/><circle cx="552" cy="380" r="16" fill="none" stroke-width="3"/></g><!--copy--><text class="t title" x="450" y="496" text-anchor="middle">Course Complete</text><path d="M 337 517 C 384 511 431 520 478 513 C 504 509 530 516 563 512" fill="none" stroke="#DE5EA5" stroke-width="5" stroke-linecap="round"/><text class="t kicker" x="450" y="576" text-anchor="middle">COURSE PROGRESS</text><text class="t numeral" x="450" y="652" text-anchor="middle">100%</text></svg>