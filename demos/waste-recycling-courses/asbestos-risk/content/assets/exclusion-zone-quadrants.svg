<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ezTitle ezDesc"><title id="ezTitle">Why an exclusion zone exists</title><desc id="ezDesc">Four purposes of an ACM exclusion zone: prevent spread by stopping fibres spreading, keep people safe by keeping workers away, support safe management, and protect the public.</desc><defs><style>@import url(&apos;https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap&apos;);
      .wraq  { font-family: &apos;Poppins&apos;, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif; }
      .t     { font-size: 30px; font-weight: 700; fill: #ffffff; }
      .s     { font-size: 20px; font-weight: 600; fill: #ffffff; fill-opacity: 0.94; }
      .hub   { font-size: 37px; font-weight: 700; fill: #7b1950; text-anchor: middle; }
      .lft   { text-anchor: end; }
      .rgt   { text-anchor: start; }</style></defs><g class="wraq"><!--quadrants--><path d="M443 45 H255 A210 210 0 0 0 45 255 V443 H443 Z" fill="#C37509"/><path d="M457 45 H645 A210 210 0 0 1 855 255 V443 H457 Z" fill="#f15a2e"/><path d="M45 457 V645 A210 210 0 0 0 255 855 H443 V457 Z" fill="#7b1950"/><path d="M855 457 V645 A210 210 0 0 1 645 855 H457 V457 Z" fill="#e3204c"/><!--dotted halo hugging the hub--><circle cx="450" cy="450" r="212" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.5 16" opacity="0.55"/><!--hub--><circle cx="450" cy="450" r="200" fill="#ffffff"/><circle cx="450" cy="450" r="186" fill="#f5e9ee"/><circle cx="450" cy="450" r="186" fill="none" stroke="#e5dccd" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 14"/><text class="hub" x="450" y="437">Exclusion</text><text class="hub" x="450" y="485">Zone</text><!--top left--><text class="t lft" x="398" y="176">Prevent spread</text><path d="M268 194 C 300 190 332 198 364 192 C 378 189 390 194 398 192" fill="none" stroke="#F4CA90" stroke-width="5" stroke-linecap="round"/><text class="s lft" x="398" y="226">Stop fibres spreading</text><!--top right--><text class="t rgt" x="502" y="176">Keep people safe</text><path d="M502 194 C 534 190 566 198 598 192 C 612 189 624 194 632 192" fill="none" stroke="#F2A792" stroke-width="5" stroke-linecap="round"/><text class="s rgt" x="502" y="226">Keep workers away</text><!--bottom left--><text class="t lft" x="398" y="724">Safe management</text><path d="M268 742 C 300 738 332 746 364 740 C 378 737 390 742 398 740" fill="none" stroke="#E69DC6" stroke-width="5" stroke-linecap="round"/><text class="s lft" x="398" y="774">Support safe</text><text class="s lft" x="398" y="806">management</text><!--bottom right--><text class="t rgt" x="502" y="724">Protect public</text><path d="M502 742 C 534 738 566 746 598 740 C 612 737 624 742 632 740" fill="none" stroke="#ED97AA" stroke-width="5" stroke-linecap="round"/><text class="s rgt" x="502" y="774">Protect the public</text></g></svg>