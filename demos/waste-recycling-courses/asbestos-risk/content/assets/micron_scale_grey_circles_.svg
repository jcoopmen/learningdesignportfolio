<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2048" viewBox="0 0 2000 2048" role="img" aria-labelledby="title desc"><title id="title">Micron scale comparison</title><desc id="desc">A descending scale of solid grey circles comparing human hair, the limit of visibility, a white blood cell, smoke, a red blood cell, a respirable fibre and a single micron.</desc><style>.label { font-family: &apos;Poppins&apos;, Arial, sans-serif; }
    .heading { font-size: 50px; font-weight: 600; fill: #E2204C; }
    .body { font-size: 40px; font-weight: 400; fill: #4D4D4F; }
    .circle { fill: #4D4D4F; }</style><rect width="2000" height="2048" fill="#EFEBE3"/><circle class="circle" cx="1003" cy="347" r="225"/><g class="label" transform="translate(1344 303)"><text class="heading" x="0" y="0">Human Hair</text><text class="body" x="0" y="57">Approx. 75 Micron</text></g><circle class="circle" cx="1147" cy="790" r="145"/><g class="label" transform="translate(1403 754)"><text class="heading" x="0" y="0">Limit of Visibility</text><text class="body" x="0" y="57">Approx. 44 Micron</text></g><circle class="circle" cx="1124" cy="1134" r="118"/><g class="label" transform="translate(1342 1115)"><text class="heading" x="0" y="0">White Blood Cell</text><text class="body" x="0" y="57">Approx. 25 Micron</text></g><circle class="circle" cx="949" cy="1400" r="92"/><g class="label" transform="translate(1120 1397)"><text class="heading" x="0" y="0">Smoke</text><text class="body" x="0" y="57">Approx. 10 Micron</text></g><circle class="circle" cx="711" cy="1600" r="57"/><g class="label" transform="translate(878 1596)"><text class="heading" x="0" y="0">Red Blood Cell</text><text class="body" x="0" y="57">Approx. 5 Micron</text></g><circle class="circle" cx="425" cy="1754" r="40"/><g class="label" transform="translate(535 1787)"><text class="heading" x="0" y="0">Respirable Fiber</text><text class="body" x="0" y="57">Approx. 3 Micron</text></g><circle class="circle" cx="182" cy="1860" r="17"/><g class="label" transform="translate(258 1936)"><text class="heading" x="0" y="0">Single Micron</text></g></svg>