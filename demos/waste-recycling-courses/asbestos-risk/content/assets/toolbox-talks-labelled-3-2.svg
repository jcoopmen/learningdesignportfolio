<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttTitle ttDesc"><title id="ttTitle">Toolbox talk topics: five asbestos awareness areas</title><desc id="ttDesc">Five labelled panels arranged three over two — what asbestos looks like, where it may be found, warning signs in materials, if it is suspected or found, and legal safety requirements. Each panel carries an empty circular slot for an interactive button.</desc><defs><style>@import url(&apos;https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap&apos;);
      .wraq   { font-family: &apos;Poppins&apos;, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif; }
      .kicker { font-size: 13px; font-weight: 600; letter-spacing: 2.2px; }
      .title  { font-size: 26px; font-weight: 700; }
      .onDark { fill: #ffffff; }
      .onAmber{ fill: #5E1240; }</style></defs><!--============ TOP ROW ============--><g id="card-1" data-label="What asbestos looks like"><rect x="100" y="30" width="340" height="220" rx="14" fill="#F5A623"/><path d="M130 250 L130 282 L166 250 Z" fill="#F5A623"/><g class="wraq"><path d="M128 54 L134.9 58 L134.9 66 L128 70 L121.1 66 L121.1 58 Z" fill="#5E1240" opacity="0.55"/><text class="kicker onAmber" x="147" y="68" opacity="0.75">TOPIC 01</text><text class="title onAmber" x="120" y="118">What asbestos</text><text class="title onAmber" x="120" y="150">looks like</text><path d="M121 170 C 161 165 201 175 241 168" fill="none" stroke="#5E1240" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/></g><g id="btn-slot-1" data-slot="1"><circle cx="270" cy="210" r="25" fill="#5E1240" fill-opacity="0.12"/><circle cx="270" cy="210" r="25" fill="none" stroke="#5E1240" stroke-opacity="0.45" stroke-width="2"/></g></g><g id="card-2" data-label="Where it may be found"><rect x="470" y="30" width="340" height="220" rx="14" fill="#F4551F"/><path d="M500 250 L500 282 L536 250 Z" fill="#F4551F"/><g class="wraq"><path d="M498 54 L504.9 58 L504.9 66 L498 70 L491.1 66 L491.1 58 Z" fill="#FFC0A8"/><text class="kicker onDark" x="517" y="68" opacity="0.82">TOPIC 02</text><text class="title onDark" x="490" y="118">Where it may</text><text class="title onDark" x="490" y="150">be found</text><path d="M491 170 C 531 165 571 175 611 168" fill="none" stroke="#FFC0A8" stroke-width="4.5" stroke-linecap="round"/></g><g id="btn-slot-2" data-slot="2"><circle cx="640" cy="210" r="25" fill="#ffffff" fill-opacity="0.14"/><circle cx="640" cy="210" r="25" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/></g></g><g id="card-3" data-label="Warning signs in materials"><rect x="840" y="30" width="340" height="220" rx="14" fill="#E5245A"/><path d="M870 250 L870 282 L906 250 Z" fill="#E5245A"/><g class="wraq"><path d="M868 54 L874.9 58 L874.9 66 L868 70 L861.1 66 L861.1 58 Z" fill="#FFB3C6"/><text class="kicker onDark" x="887" y="68" opacity="0.82">TOPIC 03</text><text class="title onDark" x="860" y="118">Warning signs</text><text class="title onDark" x="860" y="150">in materials</text><path d="M861 170 C 901 165 941 175 981 168" fill="none" stroke="#FFB3C6" stroke-width="4.5" stroke-linecap="round"/></g><g id="btn-slot-3" data-slot="3"><circle cx="1010" cy="210" r="25" fill="#ffffff" fill-opacity="0.14"/><circle cx="1010" cy="210" r="25" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/></g></g><!--dotted trace beneath the top row--><g><path d="M100 302 L1180 302" fill="none" stroke="#4D4D4D" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0.5 14" opacity="0.38"/><path d="M130 294 L136.9 298 L136.9 306 L130 310 L123.1 306 L123.1 298 Z" fill="#F5A623"/><path d="M500 294 L506.9 298 L506.9 306 L500 310 L493.1 306 L493.1 298 Z" fill="#F4551F"/><path d="M870 294 L876.9 298 L876.9 306 L870 310 L863.1 306 L863.1 298 Z" fill="#E5245A"/></g><!--============ BOTTOM ROW ============--><g id="card-4" data-label="If it is suspected or found"><rect x="285" y="342" width="340" height="220" rx="14" fill="#7A1D4F"/><path d="M315 562 L315 594 L351 562 Z" fill="#7A1D4F"/><g class="wraq"><path d="M313 366 L319.9 370 L319.9 378 L313 382 L306.1 378 L306.1 370 Z" fill="#F59F2A"/><text class="kicker onDark" x="332" y="380" opacity="0.82">TOPIC 04</text><text class="title onDark" x="305" y="430">If it’s suspected</text><text class="title onDark" x="305" y="462">or found</text><path d="M306 482 C 346 477 386 487 426 480" fill="none" stroke="#F59F2A" stroke-width="4.5" stroke-linecap="round"/></g><g id="btn-slot-4" data-slot="4"><circle cx="455" cy="522" r="25" fill="#ffffff" fill-opacity="0.14"/><circle cx="455" cy="522" r="25" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/></g></g><g id="card-5" data-label="Legal safety requirements"><rect x="655" y="342" width="340" height="220" rx="14" fill="#4D4D4D"/><path d="M685 562 L685 594 L721 562 Z" fill="#4D4D4D"/><g class="wraq"><path d="M683 366 L689.9 370 L689.9 378 L683 382 L676.1 378 L676.1 370 Z" fill="#C9C6BF"/><text class="kicker onDark" x="702" y="380" opacity="0.82">TOPIC 05</text><text class="title onDark" x="675" y="430">Legal safety</text><text class="title onDark" x="675" y="462">requirements</text><path d="M676 482 C 716 477 756 487 796 480" fill="none" stroke="#C9C6BF" stroke-width="4.5" stroke-linecap="round"/></g><g id="btn-slot-5" data-slot="5"><circle cx="825" cy="522" r="25" fill="#ffffff" fill-opacity="0.14"/><circle cx="825" cy="522" r="25" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/></g></g><!--dotted trace beneath the bottom row--><g><path d="M285 614 L995 614" fill="none" stroke="#4D4D4D" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0.5 14" opacity="0.38"/><path d="M315 606 L321.9 610 L321.9 618 L315 622 L308.1 618 L308.1 610 Z" fill="#7A1D4F"/><path d="M685 606 L691.9 610 L691.9 618 L685 622 L678.1 618 L678.1 610 Z" fill="#4D4D4D"/></g></svg>