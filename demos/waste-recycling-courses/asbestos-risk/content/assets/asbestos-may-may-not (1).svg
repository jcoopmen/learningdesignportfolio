<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttl dsc" aria-label="Asbestos removal, what you may and may not do. A two panel comparison split by a 10 square metre threshold marker. Left panel, headed &quot;You may&quot;, lists five permitted actions each marked with a green tick: Assume asbestos may be present; Isolate and secure ACM; Apply dust suppression; Remove 10 square metres or less of non-friable asbestos; Package and label asbestos waste. Right panel, headed &quot;You may NOT&quot;, lists three prohibited actions each marked with a red cross: Cut, grind, break, or resize ACM; Remove friable asbestos; Remove more than 10 square metres of non-friable asbestos. Between the panels a marker labelled THRESHOLD shows the figure 10 square metres, the non-friable area limit that separates permitted removal from prohibited removal."><title id="ttl">Asbestos removal: what you may and may not do</title><desc id="dsc">Asbestos removal, what you may and may not do. A two panel comparison split by a 10 square metre threshold marker. Left panel, headed &quot;You may&quot;, lists five permitted actions each marked with a green tick: Assume asbestos may be present; Isolate and secure ACM; Apply dust suppression; Remove 10 square metres or less of non-friable asbestos; Package and label asbestos waste. Right panel, headed &quot;You may NOT&quot;, lists three prohibited actions each marked with a red cross: Cut, grind, break, or resize ACM; Remove friable asbestos; Remove more than 10 square metres of non-friable asbestos. Between the panels a marker labelled THRESHOLD shows the figure 10 square metres, the non-friable area limit that separates permitted removal from prohibited removal.</desc><defs><style>@import url(&apos;https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&amp;display=swap&apos;);
      .head { font-family: &apos;Poppins&apos;, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 700; }
      .body { font-family: &apos;Poppins&apos;, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 400; fill: #313537; }
      .kick { font-family: &apos;Poppins&apos;, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 2.1px;
               fill: #6a7176; text-anchor: middle; }
      .num  { font-family: &apos;Poppins&apos;, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif; font-size: 46px; font-weight: 700; fill: #7a194f;
               text-anchor: middle; }
      .unit { font-size: 24px; font-weight: 600; }</style><clipPath id="clipL"><rect x="40" y="44" width="530" height="612" rx="16"/></clipPath><clipPath id="clipR"><rect x="710" y="44" width="530" height="612" rx="16"/></clipPath></defs><rect x="0" y="0" width="1280" height="700" fill="#ffffff"/><!--offset plates--><rect x="49" y="53" width="530" height="612" rx="16" fill="#C8E2AB" opacity="0.55"/><rect x="719" y="53" width="530" height="612" rx="16" fill="#ECA2B3" opacity="0.55"/><!--panels--><rect x="40" y="44" width="530" height="612" rx="16" fill="#EBF3E2"/><rect x="710" y="44" width="530" height="612" rx="16" fill="#F6E0E5"/><g clip-path="url(#clipL)"><rect x="40" y="44" width="530" height="11" fill="#4E7920"/><rect x="40" y="648" width="530" height="8" fill="#2C4412"/></g><g clip-path="url(#clipR)"><rect x="710" y="44" width="530" height="11" fill="#E2204C"/><rect x="710" y="648" width="530" height="8" fill="#4D0A19"/><!--layered echo filling the shorter column--><g fill="none" stroke="#E95475" stroke-width="3"><rect x="1116" y="552" width="128" height="128" rx="22" opacity="0.55"/><rect x="1080" y="516" width="200" height="200" rx="30" opacity="0.4"/><rect x="1044" y="480" width="272" height="272" rx="38" opacity="0.28"/></g></g><!--icon: tick--><rect x="96" y="112" width="96" height="96" rx="10" fill="#C8E2AB" opacity="0.7"/><rect x="88" y="104" width="96" height="96" rx="10" fill="#ffffff" stroke="#4E7920" stroke-width="4"/><path d="M106.5 152.8 L127.2 184.0 L167.6 124.7 L160.4 119.3 L126.8 158.0 L113.5 147.2 Z" fill="#4E7920" stroke="#4E7920" stroke-width="2.5" stroke-linejoin="round"/><!--icon: cross--><rect x="766" y="112" width="96" height="96" rx="10" fill="#ECA2B3" opacity="0.7"/><rect x="758" y="104" width="96" height="96" rx="10" fill="#ffffff" stroke="#E2204C" stroke-width="4"/><path d="M773.8 126.2 L799.3 158.7 L831.8 184.2 L838.2 177.8 L812.7 145.3 L780.2 119.8 Z" fill="#E2204C" stroke="#E2204C" stroke-width="2.5" stroke-linejoin="round"/><path d="M831.8 119.8 L799.3 145.3 L773.8 177.8 L780.2 184.2 L812.7 158.7 L838.2 126.2 Z" fill="#E2204C" stroke="#E2204C" stroke-width="2.5" stroke-linejoin="round"/><!--headings--><text x="216" y="166" class="head" fill="#2C4412">You may</text><path d="M216 194 C 240 190 264 198 288 191 C 297 189 305 194 313 191" fill="none" stroke="#4E7920" stroke-width="5" stroke-linecap="round"/><text x="886" y="166" class="head" fill="#4D0A19">You may NOT</text><path d="M886 194 C 916 190 946 199 976 191 C 997 186 1017 195 1037 191" fill="none" stroke="#83112B" stroke-width="5" stroke-linecap="round"/><!--list items--><g><path d="M88.4 291.6 L98.6 304.1 L113.9 278.3 L110.1 275.7 L97.4 291.9 L91.6 288.4 Z" fill="#4E7920"/><text x="136" y="296" class="body">Assume asbestos may be present</text><path d="M88.4 352.6 L98.6 365.1 L113.9 339.3 L110.1 336.7 L97.4 352.9 L91.6 349.4 Z" fill="#4E7920"/><text x="136" y="357" class="body">Isolate and secure ACM</text><path d="M88.4 413.6 L98.6 426.1 L113.9 400.3 L110.1 397.7 L97.4 413.9 L91.6 410.4 Z" fill="#4E7920"/><text x="136" y="418" class="body">Apply dust suppression</text><path d="M88.4 474.6 L98.6 487.1 L113.9 461.3 L110.1 458.7 L97.4 474.9 L91.6 471.4 Z" fill="#4E7920"/><text x="136" y="479" class="body">Remove 10m² or less of</text><text x="136" y="510" class="body">non-friable asbestos</text><path d="M88.4 566.6 L98.6 579.1 L113.9 553.3 L110.1 550.7 L97.4 566.9 L91.6 563.4 Z" fill="#4E7920"/><text x="136" y="571" class="body">Package and label asbestos waste</text></g><g><path d="M758.5 280.5 L766.2 290.8 L776.5 298.5 L779.5 295.5 L771.8 285.2 L761.5 277.5 Z" fill="#83112B"/><path d="M776.5 277.5 L766.2 285.2 L758.5 295.5 L761.5 298.5 L771.8 290.8 L779.5 280.5 Z" fill="#83112B"/><text x="806" y="296" class="body">Cut, grind, break, or resize ACM</text><path d="M758.5 341.5 L766.2 351.8 L776.5 359.5 L779.5 356.5 L771.8 346.2 L761.5 338.5 Z" fill="#83112B"/><path d="M776.5 338.5 L766.2 346.2 L758.5 356.5 L761.5 359.5 L771.8 351.8 L779.5 341.5 Z" fill="#83112B"/><text x="806" y="357" class="body">Remove friable asbestos</text><path d="M758.5 402.5 L766.2 412.8 L776.5 420.5 L779.5 417.5 L771.8 407.2 L761.5 399.5 Z" fill="#83112B"/><path d="M776.5 399.5 L766.2 407.2 L758.5 417.5 L761.5 420.5 L771.8 412.8 L779.5 402.5 Z" fill="#83112B"/><text x="806" y="418" class="body">Remove more than 10m² of</text><text x="806" y="449" class="body">non-friable asbestos</text></g><!--threshold divider--><g stroke="#e5dccd" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.5 13" fill="none"><path d="M640 48 L640 254"/><path d="M640 426 L640 652"/><circle cx="640" cy="350" r="66"/></g><circle cx="640" cy="350" r="52" fill="#f5e9ee"/><text x="640" y="266" class="kick">THRESHOLD</text><text x="640" y="366" class="num">10<tspan class="unit">m²</tspan></text></svg>