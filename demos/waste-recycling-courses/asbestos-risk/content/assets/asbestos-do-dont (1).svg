<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 644" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttl dsc" aria-label="Asbestos work practices, Do and Do not. A two panel comparison. Left panel, headed Do, lists four required actions each marked with a green tick: Follow safe work procedures; Use correct PPE; Place ACM waste in suitable containers; Dispose of ACM waste correctly. Right panel, headed Do not, lists four prohibited actions each marked with a red cross: Expose yourself and others to asbestos; Use power tools that create dust; Use brooms or brushes; Reuse disposable PPE."><title id="ttl">Asbestos work practices: Do and Don’t</title><desc id="dsc">Asbestos work practices, Do and Do not. A two panel comparison. Left panel, headed Do, lists four required actions each marked with a green tick: Follow safe work procedures; Use correct PPE; Place ACM waste in suitable containers; Dispose of ACM waste correctly. Right panel, headed Do not, lists four prohibited actions each marked with a red cross: Expose yourself and others to asbestos; Use power tools that create dust; Use brooms or brushes; Reuse disposable PPE.</desc><defs><style>@import url(&apos;https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&amp;display=swap&apos;);
      .head { font-family: &apos;Poppins&apos;, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif; font-size: 40px; font-weight: 700; }
      .body { font-family: &apos;Poppins&apos;, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 400; fill: #313537; }</style><clipPath id="clipL"><rect x="40" y="44" width="530" height="555" rx="16"/></clipPath><clipPath id="clipR"><rect x="710" y="44" width="530" height="555" rx="16"/></clipPath></defs><rect x="0" y="0" width="1280" height="644" fill="#ffffff"/><!--offset plates--><rect x="49" y="53" width="530" height="555" rx="16" fill="#C8E2AB" opacity="0.55"/><rect x="719" y="53" width="530" height="555" rx="16" fill="#ECA2B3" opacity="0.55"/><!--panels--><rect x="40" y="44" width="530" height="555" rx="16" fill="#EBF3E2"/><rect x="710" y="44" width="530" height="555" rx="16" fill="#F6E0E5"/><g clip-path="url(#clipL)"><rect x="40" y="44" width="530" height="11" fill="#4E7920"/><rect x="40" y="591" width="530" height="8" fill="#2C4412"/></g><g clip-path="url(#clipR)"><rect x="710" y="44" width="530" height="11" fill="#E2204C"/><rect x="710" y="591" width="530" height="8" fill="#4D0A19"/></g><!--icon: tick--><rect x="96" y="112" width="96" height="96" rx="10" fill="#C8E2AB" opacity="0.7"/><rect x="88" y="104" width="96" height="96" rx="10" fill="#ffffff" stroke="#4E7920" stroke-width="4"/><path d="M106.5 152.8 L127.2 184.0 L167.6 124.7 L160.4 119.3 L126.8 158.0 L113.5 147.2 Z" fill="#4E7920" stroke="#4E7920" stroke-width="2.5" stroke-linejoin="round"/><!--icon: cross--><rect x="766" y="112" width="96" height="96" rx="10" fill="#ECA2B3" opacity="0.7"/><rect x="758" y="104" width="96" height="96" rx="10" fill="#ffffff" stroke="#E2204C" stroke-width="4"/><path d="M773.8 126.2 L799.3 158.7 L831.8 184.2 L838.2 177.8 L812.7 145.3 L780.2 119.8 Z" fill="#E2204C" stroke="#E2204C" stroke-width="2.5" stroke-linejoin="round"/><path d="M831.8 119.8 L799.3 145.3 L773.8 177.8 L780.2 184.2 L812.7 158.7 L838.2 126.2 Z" fill="#E2204C" stroke="#E2204C" stroke-width="2.5" stroke-linejoin="round"/><!--headings--><text x="216" y="166" class="head" fill="#2C4412">Do</text><path d="M216 194 C 229 190 241 197 254 191" fill="none" stroke="#4E7920" stroke-width="5" stroke-linecap="round"/><text x="886" y="166" class="head" fill="#4D0A19">Don’t</text><path d="M886 194 C 901 190 916 198 931 191 C 940 187 950 195 958 191" fill="none" stroke="#83112B" stroke-width="5" stroke-linecap="round"/><!--list items--><g><path d="M88.2 291.6 L98.4 305.5 L115.0 278.4 L111.0 275.6 L97.6 292.5 L91.8 288.4 Z" fill="#4E7920"/><text x="136" y="296" class="body">Follow safe work procedures</text><path d="M88.2 353.6 L98.4 367.5 L115.0 340.4 L111.0 337.6 L97.6 354.5 L91.8 350.4 Z" fill="#4E7920"/><text x="136" y="358" class="body">Use correct PPE</text><path d="M88.2 415.6 L98.4 429.5 L115.0 402.4 L111.0 399.6 L97.6 416.5 L91.8 412.4 Z" fill="#4E7920"/><text x="136" y="420" class="body">Place ACM waste in suitable</text><text x="136" y="452" class="body">containers</text><path d="M88.2 509.6 L98.4 523.5 L115.0 496.4 L111.0 493.6 L97.6 510.5 L91.8 506.4 Z" fill="#4E7920"/><text x="136" y="514" class="body">Dispose of ACM waste correctly</text></g><g><path d="M758.4 279.6 L766.2 289.8 L777.4 298.6 L780.6 295.4 L771.8 284.2 L761.6 276.4 Z" fill="#83112B"/><path d="M777.5 276.4 L766.2 284.2 L758.4 295.5 L761.6 298.5 L771.8 289.8 L780.5 279.6 Z" fill="#83112B"/><text x="806" y="296" class="body">Expose yourself and others</text><text x="806" y="328" class="body">to asbestos</text><path d="M758.4 373.6 L766.2 383.8 L777.4 392.6 L780.6 389.4 L771.8 378.2 L761.6 370.4 Z" fill="#83112B"/><path d="M777.5 370.4 L766.2 378.2 L758.4 389.5 L761.6 392.5 L771.8 383.8 L780.5 373.6 Z" fill="#83112B"/><text x="806" y="390" class="body">Use power tools that create dust</text><path d="M758.4 435.6 L766.2 445.8 L777.4 454.6 L780.6 451.4 L771.8 440.2 L761.6 432.4 Z" fill="#83112B"/><path d="M777.5 432.4 L766.2 440.2 L758.4 451.5 L761.6 454.5 L771.8 445.8 L780.5 435.6 Z" fill="#83112B"/><text x="806" y="452" class="body">Use brooms or brushes</text><path d="M758.4 497.6 L766.2 507.8 L777.4 516.6 L780.6 513.4 L771.8 502.2 L761.6 494.4 Z" fill="#83112B"/><path d="M777.5 494.4 L766.2 502.2 L758.4 513.5 L761.6 516.5 L771.8 507.8 L780.5 497.6 Z" fill="#83112B"/><text x="806" y="514" class="body">Reuse disposable PPE</text></g><!--dividing trace--><path d="M640 48 L640 595" fill="none" stroke="#e5dccd" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.5 13"/></svg>