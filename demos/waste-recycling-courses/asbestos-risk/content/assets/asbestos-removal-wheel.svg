<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttl dsc"><title id="ttl">Asbestos removal equipment wheel</title><desc id="dsc">A circular wheel divided into nine equal coloured segments around a central white hub labelled Asbestos Removal. Reading clockwise from the top, the nine segments are: PPE; Drop sheets; Waste bags; Disposable wipes; Barricading / tape; Warning Signs; Sealants PVA; HEPA Vac; Spray Bottles. Segment colours rotate through burgundy, red and amber. Each segment contains an empty circular outline near the hub, reserved as a placeholder for an icon. A dotted ring around the hub carries nine small coloured markers, one aligned to each segment.</desc><defs><style>@import url(&apos;https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&amp;display=swap&apos;);.f{font-family:&apos;Poppins&apos;,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif}.lbl{font-size:22px;font-weight:700;fill:#FFFFFF}.hub{font-size:33px;font-weight:700;fill:#7A194F;letter-spacing:0.2px}</style></defs><rect width="900" height="900" fill="#FFFFFF"/><circle cx="455.0" cy="452.0" r="414.0" fill="#E6A7CA" opacity="0.55"/><g><path d="M 384.4 272.9 L 304.4 53.0 A 414.0 414.0 0 0 1 587.6 53.0 L 507.6 272.9 A 180.0 180.0 0 0 0 384.4 272.9 Z" fill="#7A194F" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><path d="M 507.6 272.9 L 587.6 53.0 A 414.0 414.0 0 0 1 804.5 235.0 L 601.9 352.0 A 180.0 180.0 0 0 0 507.6 272.9 Z" fill="#E2204C" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><path d="M 601.9 352.0 L 804.5 235.0 A 414.0 414.0 0 0 1 853.7 513.9 L 623.3 473.3 A 180.0 180.0 0 0 0 601.9 352.0 Z" fill="#C37509" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><path d="M 623.3 473.3 L 853.7 513.9 A 414.0 414.0 0 0 1 712.1 759.1 L 561.7 579.9 A 180.0 180.0 0 0 0 623.3 473.3 Z" fill="#7A194F" stroke="#FFFFFF" stroke-width="3" strok