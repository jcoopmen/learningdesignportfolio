      .label { font-size: 34px; font-weight: 700; }
      .kick  { font-size: 12.5px; font-weight: 600; letter-spacing: 2.1px; fill: #6a7176; }
      .zone  { font-size: 20px; font-weight: 500; fill: #313537; }
      .num   { font-size: 31px; font-weight: 700; }
      text   { text-anchor: middle; }</style></defs><!--connective trace: the scale descending from extreme to low--><path d="M8 120 C 150 106 250 148 320 150 C 430 153 520 128 640 132
