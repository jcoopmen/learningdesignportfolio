EXCLUSION ZONE</text><text class="zone" x="480" y="432"><tspan class="num" fill="#E2204C">25m</tspan> from ACM</text></g><!--MEDIUM--><g class="wraq"><path d="M810 46 L912.2 105 L912.2 223 L810 282 L707.8 223 L707.8 105 Z" fill="#F2CE9B" opacity="0.6"/><path d="M800 36 L902.2 95 L902.2 213 L800 272 L697.8 213 L697.8 95 Z" fill="#f59f2a"/><g fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><path d="M771 96 L789 96 L784.5 154 L775.5 154 Z"/><path d="M811 96 L829 96 L824.5 154 L815.5 154 Z"/></g><g fill="#ffffff"><circle cx="780" cy="176" r="9"/><circle cx="820" cy="176" r="9"/></g><text class="label" x="800" y="336" fill="#A66408">Medium Risk</text><path d="M756 352 C 778 348 800 356 822 350 C 834 347 844 352 850 350" fill="none" stroke="#F2CE9B" stroke-width="5" stroke-linecap="round"/><text class="kick" x="800" y="392">EXCLUSION ZONE</text><text class="zone" x="800" y="432"><tspan class="num" fill="#A66408">10m</tspan> from ACM</text></g><!--LOW--><g class="wraq"><path d="M1130 46 L1232.2 105 L1232.2 223 L1130 282 L1027.8 223 L1027.8 105 Z" fill="#C8E3AB" opacity="0.6"/><path d="M1120 36 L1222.2 95 L1222.2 213 L1120 272 L1017.8 213 L1017.8 95 Z" fill="#4E7920"/><path d="M1111 96 L1129 96 L1124.5 154 L1115.5 154 Z" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/><circle cx="1120" cy="176" r="9" fill="#ffffff"/><text class="label" x="1120" y="336" fill="#4E7920">Low Risk</text><path d="M1083 352 C 1101 348 1119 356 1137 350 C 1146 347 1153 352 1158 350" fill="none" stroke="#C8E3AB" stroke-width="5" stroke-linecap="round"/><text class="kick" x="1120" y="392">EXCLUSION ZONE</text><text class="zone" x="1120" y="432"><tspan class="num" fill="#4E7920">10m</tspan> from ACM</text></g></svg>