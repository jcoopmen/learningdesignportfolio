<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="rsTitle rsDesc"><title id="rsTitle">ACM risk levels and exclusion zones</title><desc id="rsDesc">Four risk levels. Extreme Risk: exclusion zone 50m from ACM. High Risk: 25m. Medium Risk: 10m. Low Risk: 10m.</desc><defs><style>@import url(&apos;https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap&apos;);
