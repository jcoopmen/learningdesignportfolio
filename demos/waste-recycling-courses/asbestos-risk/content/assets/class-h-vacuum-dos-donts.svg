<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttl dsc" aria-label="Class H asbestos vacuum cleaners, DOs and DON’Ts. A two panel comparison split by a vacuum class marker showing the letter H. Left panel, headed DOs, lists four required actions each marked with a green tick: Comply with Class H Requirements in AS/NZ 60335.2.69; Comply with ASS 4260:1997; Use for collecting small pieces of asbestos dust and debris; Procedures for general maintenance including emptying. Right panel, headed DON’Ts, lists three prohibited actions each marked with a red cross: Do not use for large pieces of asbestos; Do not use on wet materials or surfaces; Do not use household vacuum cleaners. Between the panels a marker labelled VACUUM CLASS shows the letter H, the class of vacuum cleaner these rules apply to."><title id="ttl">Class H asbestos vacuum cleaners: DOs and DON’Ts</title><desc id="dsc">Class H asbestos vacuum cleaners, DOs and DON’Ts. A two panel comparison split by a vacuum class marker showing the letter H. Left panel, headed DOs, lists four required actions each marked with a green tick: Comply with Class H Requirements in AS/NZ 60335.2.69; Comply with ASS 4260:1997; Use for collecting small pieces of asbestos dust and debris; Procedures for general maintenance including emptying. Right panel, headed DON’Ts, lists three prohibited actions each marked with a red cross: Do not use for large pieces of asbestos; Do not use on wet materials or surfaces; Do not use household vacuum cleaners. Between the panels a marker labelled VACUUM CLASS shows the letter H, the class of vacuum cleaner these rules apply to.</desc><defs><style>@import url(&apos;https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&amp;display=swap&apos;);
      .head { font-family: &apos;Poppins&apos;, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 700; }
      .body { font-family: &apos;Poppins&apos;, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 400; fill: #313537; }
      .kick { font-family: &apos;Poppins&apos;, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 2.1px;
               fill: #6a7176; text-anchor: middle; }
      .num  { font-family: &apos;Poppins&apos;, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif; font-size: 58px; font-weight: 700; fill: #7a194f;
               text-anchor: middle; }</style><clipPath id="clipL"><rect x="40" y="44" width="530" height="612" rx="16"/></clipPath><clipPath id="clipR"><rect x="710" y="44" width="530" height="612" rx="16"/></clipPath></defs><rect x="0" y="0" width="1280" height="700" fill="#ffffff"/><!--offset plates--><rect x="49" y="53" width="530" height="612" rx="16" fill="#C8E2AB" opacity="0.55"/><rect x="719" y="53" width="530" height="612" rx="16" fill="#ECA2B3" opacity="0.55"/><!--panels--><rect x="40" y="44" width="530" height="612" rx="16" fill="#EBF3E2"/><rect x="710" y="44" width="530" height="612" rx="16" fill="#F6E0E5"/><g clip-path="url(#clipL)"><rect x="40" y="44" width="530" height="11" fill="#4E7920"/><rect x="40" y="648" width="530" height="8" fill="#2C4412"/></g><g clip-path="url(#clipR)"><rect x="710" y="44" width="530" height="11" fill="#E2204C"/><rect x="710" y="648" width="530" height="8" fill="#4D0A19"/><!--layered echo filling the shorter column--><g fill="none" stroke="#E95475" stroke-width="3"><rect x="1130" y="586" width="130" height="130" rx="22" opacity="0.55"/><rect x="1094" y="550" width="202" height="202" rx="30" opacity="0.4"/><rect x="1058" y="514" width="274" height="274" rx="38" opacity="0.28"/></g></g><!--icon: tick--><rect x="96" y="112" width="96" height="96" rx="10" fill="#C8E2AB" opacity="0.7"/><rect x="88" y="104" width="96" height="96" rx="10" fill="#ffffff" stroke="#4E7920" stroke-width="4"/><path d="M106.5 152.8 L127.2 184.0 L167.6 124.7 L160.4 119.3 L126.8 158.0 L113.5 147.2 Z" fill="#4E7920" stroke="#4E7920" stroke-width="2.5" stroke-linejoin="round"/><!--icon: cross--><rect x="766" y="112" width="96" height="96" rx="10" fill="#ECA2B3" opacity="0.7"/><rect x="758" y="104" width="96" height="96" rx="10" fill="#ffffff" stroke="#E2204C" stroke-width="4"/><path d="M773.8 126.2 L799.3 158.7 L831.8 184.2 L838.2 177.8 L812.7 145.3 L780.2 119.8 Z" fill="#E2204C" stroke="#E2204C" stroke-width="2.5" stroke-linejoin="round"/><path d="M831.8 119.8 L799.3 145.3 L773.8 177.8 L780.2 184.2 L812.7 158.7 L838.2 126.2 Z" fill="#E2204C" stroke="#E2204C" stroke-width="2.5" stroke-linejoin="round"/><!--headings--><text x="216" y="166" class="head" fill="#2C4412">DOs</text><path d="M216 194 C 229 190 242 197 255 191 C 259 189 264 193 268 191" fill="none" stroke="#4E7920" stroke-width="5" stroke-linecap="round"/><text x="886" y="166" class="head" fill="#4D0A19">DON’Ts</text><path d="M886 194 C 905 190 924 198 943 191 C 956 187 969 195 981 191" fill="none" stroke="#83112B" stroke-width="5" stroke-linecap="round"/><!--list items--><g><path d="M88.4 291.6 L98.6 304.1 L113.9 278.3 L110.1 275.7 L97.4 291.9 L91.6 288.4 Z" fill="#4E7920"/><text x="136" y="296" class="body">Comply with Class H Requirements</text><text x="136" y="327" class="body">in AS/NZ 60335.2.69</text><path d="M88.4 383.6 L98.6 396.1 L113.9 370.3 L110.1 367.7 L97.4 383.9 L91.6 380.4 Z" fill="#4E7920"/><text x="136" y="388" class="body">Comply with ASS 4260:1997</text><path d="M88.4 444.6 L98.6 457.1 L113.9 431.3 L110.1 428.7 L97.4 444.9 L91.6 441.4 Z" fill="#4E7920"/><text x="136" y="449" class="body">Use for collecting small pieces</text><text x="136" y="480" class="body">of asbestos dust and debris</text><path d="M88.4 536.6 L98.6 549.1 L113.9 523.3 L110.1 520.7 L97.4 536.9 L91.6 533.4 Z" fill="#4E7920"/><text x="136" y="541" class="body">Procedures for general</text><text x="136" y="572" class="body">maintenance including emptying</text></g><g><path d="M758.5 280.5 L766.2 290.8 L776.5 298.5 L779.5 295.5 L771.8 285.2 L761.5 277.5 Z" fill="#83112B"/><path d="M776.5 277.5 L766.2 285.2 L758.5 295.5 L761.5 298.5 L771.8 290.8 L779.5 280.5 Z" fill="#83112B"/><text x="806" y="296" class="body">Don’t use for large pieces</text><text x="806" y="327" class="body">of asbestos</text><path d="M758.5 372.5 L766.2 382.8 L776.5 390.5 L779.5 387.5 L771.8 377.2 L761.5 369.5 Z" fill="#83112B"/><path d="M776.5 369.5 L766.2 377.2 L758.5 387.5 L761.5 390.5 L771.8 382.8 L779.5 372.5 Z" fill="#83112B"/><text x="806" y="388" class="body">Don’t use on wet materials</text><text x="806" y="419" class="body">or surfaces</text><path d="M758.5 464.5 L766.2 474.8 L776.5 482.5 L779.5 479.5 L771.8 469.2 L761.5 461.5 Z" fill="#83112B"/><path d="M776.5 461.5 L766.2 469.2 L758.5 479.5 L761.5 482.5 L771.8 474.8 L779.5 464.5 Z" fill="#83112B"/><text x="806" y="480" class="body">Don’t use household vacuum</text><text x="806" y="511" class="body">cleaners</text></g><!--vacuum class marker--><g stroke="#e5dccd" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.5 13" fill="none"><path d="M640 48 L640 254"/><path d="M640 426 L640 652"/><circle cx="640" cy="350" r="66"/></g><circle cx="640" cy="350" r="52" fill="#f5e9ee"/><text x="640" y="266" class="kick">VACUUM CLASS</text><text x="640" y="370" class="num">H</text></svg>