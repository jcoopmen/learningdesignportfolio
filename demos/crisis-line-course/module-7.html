{sec:5, type:'mcq', title:'Phase 1: Engage', explore:true,
 intro:[
  {audio:{label:`Dominique`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(fast, loud)`, t:`They've done it again. I sat in that room for forty minutes and now they want another letter, from a specialist this time. Like, I don't even have a specialist. I have a doctor who's known me for twelve years, but apparently that isn't good enough for them. I've been dealing with this for four months now and I'm so damn sick of it!`}
  ]}}
 ],
 prompt:`Which response best fits the first phase of de-escalation, engaging Dominique?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`"Gosh that's so unfair, Dominique. Do you know if there's an appeal process? Sometimes you can ask for a decision to be reviewed by someone else."`, correct:false,
   fb:`This response acknowledges unfairness but moves to a solution before you have shown Dominique that you heard her. After four months of requests, it may come across as another task. The first step should be making good contact and showing that you are listening.`},
  {k:'B', t:`"After four months and everything you've already sent them, they want another letter. I just want you to know that I'm right here, Dominique, and I'm listening. Tell me what happened today in that room."`, correct:true,
   fb:`This response engages Dominique by briefly reflecting what she said, confirming that you are listening and inviting her to continue. It leaves the next part of the account to her.`},
  {k:'C', t:`"I can hear how upset you are, and that makes sense. Let's take a breath together before we go any further, okay? Then you can tell me."`, correct:false,
   fb:`The acknowledgement of her feelings may help, but asking Dominique to breathe directs her reaction before you have truly heard her. She may experience it as another institutional instruction. Instead, try slowing your own delivery while making room for her response.`}
 ],
 afterCorrect:[
  {audio:{label:`The strongest response`, ch:'Voice call', lines:[
    {spk:'Responder', t:`After four months and everything you've already sent them, they want another letter. I just want you to know that I'm right here, Dominique, and I'm listening. Tell me what happened today in that room.`}
  ]}}
 ]},

{sec:5, type:'mcq', title:'Phase 2: Build a collaborative relationship', explore:true,
 intro:[
  {audio:{label:`Dominique`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(still fast)`, t:`And you know what the worst part is? He didn't even look up at me. He just read it straight off his screen, "we require documentation from a specialist," like he's an AI robot. Honestly, like I wasn't sitting right there in front of him.`}
  ]}}
 ],
 prompt:`Which response best fits the second phase, building a collaborative relationship?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`"So, he just read it off a screen while you were sitting right in front of him. After four months of proving yourself, being treated like that would leave many people angry. Your anger makes a lot of sense."`, correct:true,
   fb:`This response validates Dominique's anger in context (Module 6), without trying to change it. In an earlier call, she said nobody let her be angry about this. Here, the responder acknowledges why she feels that way.`},
  {k:'B', t:`"At least you know exactly what they need now. That's something, isn't it? Once you have the specialist's letter you'll be in a much stronger position with them, don't you think?"`, correct:false,
   fb:`"At least" minimizes Dominique's experience. This response also treats the new requirement as helpful when she has already said she has no specialist. Reassurance that overlooks what the person has told you can increase distress.`},
  {k:'C', t:`Say nothing. Let her continue until she has said everything she needs to say about the meeting, and respond once she pauses for breath.`, correct:false,
   fb:`Purposeful silence can help a person continue (Module 5). Here, however, silence after Dominique describes being ignored may feel like another failure to acknowledge her. Instead, try responding briefly, then give her room to continue.`}
 ],
 afterCorrect:[
  {audio:{label:`The strongest response`, ch:'Voice call', lines:[
    {spk:'Responder', t:`So, he just read it off a screen while you were sitting right in front of him. After four months of proving yourself, being treated like that would leave many people angry. Your anger makes a lot of sense.`}
  ]}}
 ]},

{sec:5, type:'mcq', title:'Phase 3: Help the person reduce their own intensity', explore:true,
 intro:[
  {audio:{label:`Dominique`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(a long breath; quieter, but still tight)`, t:`I'm so, so tired of this. I don't even know what I'm supposed to do now.`}
  ]}}
 ],
 prompt:`Which response best fits the third phase, helping Dominique reduce her own intensity?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`"The next step is to call your doctor tomorrow and ask for a referral to a specialist. Write that down now so you don't forget it in the morning. That's what I would do."`, correct:false,
   fb:`This may be an option Dominique chooses, but the instruction takes the decision away from her. After months of being told what to provide, another direction may increase her frustration. Instead, you should ask what would help her now.`},
  {k:'B', t:`"Tell me more about what he said. What exactly were his words when he told you about the specialist? I want to understand the whole exchange."`, correct:false,
   fb:`Earlier in the call, further exploration may have helped. Dominique has now begun to settle and is talking about how she feels. Returning to the man's exact words may draw her back into the distressing exchange.`},
  {k:'C', t:`"You've been carrying this for four months now and tonight it got even heavier. We don't need to decide anything right now. Would it help more to keep talking about tonight, or to think about what comes next?"`, correct:true,
   fb:`This response follows Dominique's pace. It acknowledges the evening's impact, removes pressure to decide and offers a choice about what to discuss next. Having a choice can help restore her sense of control.`}
 ],
 afterCorrect:[
  {audio:{label:`The strongest response`, ch:'Voice call', lines:[
    {spk:'Responder', t:`You've been carrying this for four months now and tonight it got even heavier. We don't need to decide anything right now. Would it help more to keep talking about tonight, or to think about what comes next?`}
  ]}}
 ]},

{sec:5, type:'prose', title:'Activity debrief', blocks:[
  {p:`Across the three phases of the interaction, the strongest responses had three things in common:`, lede:true},
  {ul:[
    `They were brief, calm and specific to what Dominique had just said`,
    `They validated her anger without trying to change it`,
    `They respected her choices and autonomy, including what to discuss next`
  ]},
  {panel:{cls:'blue', p:`Dominique's problem remains unresolved, but the responder has shown that she was heard, and she may be able to begin considering what might help. In this way, you can see how de-escalation supports collaboration.`}}
]},

/* ---------------- TOPIC 2 ---------------- */
{sec:6, type:'section', num:'02', kicker:'Topic 2', art:'b',
 title:`Reading the trajectory of an interaction`, line:`How to recognize when an interaction moves toward next steps too soon and when a responder retreats`},

{sec:6, type:'prose', blocks:[
  {p:`The <strong>trajectory</strong> of an interaction refers to how its focus changes over time. In the previous topic, you practised building collaboration throughout de-escalation and followed the person's readiness to discuss next steps. This topic examines that judgement across a whole interaction by building on the skills you learned in Module 5.`, lede:true},
  {p:`The key skill here is to know when to move toward next steps with the person and when to remain engaged if an idea does not suit their needs in the moment. It's important to note that this judgement applies to collaborative problem solving. It never applies to the required questions about suicide, which you ask in every interaction.`},
  {panel:{cls:'blue', p:`You will practise this timing in the simulations at the end of this module.`}}
]},

{sec:6, type:'prose', title:'What the research shows', blocks:[
  {p:`Researchers in British Columbia studied hundreds of online crisis chats with adults who were having thoughts of suicide. They coded every turn the responder took as one of two categories:`, lede:true},
  {instr:`Select each category to learn more.`},
  {reveal:{items:[
    {t:`Active listening`, d:`Reflecting, validating, exploring and asking open questions`},
    {t:`Collaborative problem solving`, d:`Working with the person on what might help, including giving information and guidance`}
  ]}},
  {p:`The researchers compared chats that ended with a resolution with those that did not. Both groups began mainly with listening.`},
  {p:`What's interesting about this study, though, is that their patterns differed as the chats progressed:`},
  {tabs:[
    {label:`Chats that resolved`, p:`In chats that resolved, responders moved gradually toward collaborative problem solving and maintained that focus`},
    {label:`Chats that did not resolve`, p:`In chats that did not resolve, responders moved toward problem solving earlier, then returned toward listening later in the interaction`}
  ]}
]},

/* Continues "What the research shows". */
{sec:6, type:'prose', blocks:[
  {key:[`In this course, we use the phrase <strong>regressing under pressure</strong> to describe the process of moving toward next steps prematurely, then retreating into passive listening when the person hesitates or pushes back.`]},
  {note:`This study describes a pattern in online chats. It does not show that the timing caused the outcome. Returning to active listening can be helpful and necessary in some circumstances. The concern here is losing direction and leaving the person to carry the interaction alone.`}
]},

{sec:6, type:'prose', title:'What callers and texters say', blocks:[
  {p:`People with lived experience describe the same pattern from the other side of the interaction.`, lede:true},
  {p:`When 9-8-8 Community Member Advisors (CMAs) were asked what missteps responders can make, the most frequent answer was rushing. This includes when a responder:`},
  {ul:[
    `"rushes the conversation during the call to finish it"`,
    `is "rushing to problem solve"`,
    `is "too quick to suggest a wellness check."`
  ]}
]},

{sec:6, type:'prose', title:'Why responders retreat', blocks:[
  {p:`One of the reasons you may find yourself moving toward next steps early is because you want to help the caller or texter by creating a plan. Your own discomfort with intense emotion can also make solutions feel easier to manage than listening. In Module 5, we explored this listening block as <strong>rushing to fix</strong>.`, lede:true},
  {p:`When the person says something like "that won't work" or "I don't know," you may worry that you have made a mistake. In response, going quiet or relying on minimal encouragers may feel less intrusive.`},
  {panel:{cls:'blue', p:`If you stop exploring what the caller or texter means to communicate, however, the interaction can lose direction.`}}
]},

{sec:6, type:'prose', title:'Practical strategies for avoiding retreat', blocks:[
  {p:`When you offer an idea or response that does not fit the caller or texter's situation, here are some strategies you can use to recover instead of retreating:`, lede:true},
  {instr:`Select each strategy to learn more.`},
  {reveal:{items:[
    {t:`Acknowledge the pushback as information`, d:`"Okay, that doesn't work. That's useful to know."`},
    {t:`Return to what the person said they wanted`, d:`"You said you wanted tonight to feel more manageable. What do you think would make a difference, even a small one?"`},
    {t:`Restore choice`, d:`"Would it help to keep thinking about this together, or do you need a minute?"`}
  ]}},
  {tip:{p:`If you notice yourself retreating, it can be useful to name it honestly: "I went quiet there because I didn't want to push. Can we keep thinking about it together?" This uses the repair skills from Module 4: naming the moment, reducing pressure and restoring choice.`}}
]},

/* ---------------- ACTIVITY: READING TWO INTERACTIONS ---------------- */
{sec:7, type:'section', kicker:'Activity', art:'e', tone:'tranquil',
 title:`Reading two interactions`, line:`Compare two call transcripts and identify where each one changes direction.`},

{sec:7, type:'prose', title:'How this activity works', blocks:[
  {p:`In this activity, you will compare two call transcripts: one that moves toward resolution and one that does not. Both transcripts are composites based on quality assurance patterns, and in both interactions the callers chose not to give their names. Your task is to identify where each interaction changes direction.`, lede:true},
  {p:`To complete the activity:`},
  {ul:[
    `read each transcript in full`,
    `answer the questions about where each interaction changes direction`,
    `review the feedback and the discussion that follows`
  ]},
  {note:`Your answers are not scored. Screening questions were asked earlier in both calls, and neither caller reported thoughts of suicide. These questions are not shown.`}
]},

/* The learner reads these transcripts to answer, and the questions refer to
   their parts, so the parts are shown in full beneath one audio placeholder
   for the call (as with Module 5's model interaction). */
{sec:8, type:'mcq', title:'Transcript 1', explore:true,
 intro:[
  {p:`A woman in her fifties calls on a weekday evening. She has been talking for several minutes about her adult son, who has stopped answering her calls since an argument they had three weeks ago.`, lede:true},
  {audio:{label:`Transcript 1`}},
  {h3:`Part 1`},
  {thread:{ch:'Voice call', noCh:true, lines:[
    {spk:'Caller', meta:`(tired)`, t:`I know he's an adult. I know that. But it's been three weeks. I've left messages but I don't even know if he listens to them. Everybody is telling me to give him space. I just don't know how much more space I'm supposed to give.`},
    {spk:'Responder', t:`So you're doing exactly what everyone is telling you to do, but it isn't bringing him back, and it seems like nobody can tell you how long this is supposed to last.`},
    {spk:'Caller', meta:`(quietly)`, t:`Yes. That's it exactly.`},
    {spk:'Responder', t:`Can I ask what the argument was about? Only if you want to tell me of course.`},
    {spk:'Caller', t:`It was about his partner. I said something I shouldn't have about him. I apologized the next day, by text. He never answered that either.`},
    {spk:'Responder', t:`You apologized and the silence just continued. It sounds as though you're not only missing him, you're also wondering whether your apology even reached him.`},
    {spk:'Caller', t:`Yeah, I worry about that all day. <span class="meta">(her voice catches)</span> I just want to know he's okay. <span class="meta">(she cries quietly)</span>`},
    {spk:'Responder', t:`Take your time. I'm here.`}
  ]}},
  {h3:`Part 2`},
  {thread:{ch:'Voice call', noCh:true, lines:[
    {spk:'Caller', meta:`(steadier)`, t:`Sorry. I just haven't said any of that out loud.`},
    {spk:'Responder', t:`There's nothing to be sorry about. Let me check that I have this. Three weeks ago you said something about your son's partner that you regret, you apologized the next day and you haven't heard from him since. You're giving him the space everyone recommends, and the hardest part is not knowing whether he's all right. Have I understood that?`},
    {spk:'Caller', t:`Yes. That's all of it.`},
    {spk:'Responder', t:`Thank you. Would it help to keep talking about how this has been for you, or would you like to think together about what might make the waiting more bearable?`},
    {spk:'Caller', meta:`(pause)`, t:`The second one, I think. I can't keep doing this every night.`}
  ]}},
  {h3:`Part 3`},
  {thread:{ch:'Voice call', noCh:true, lines:[
    {spk:'Responder', t:`Okay. You mentioned that you leave him messages. Is there anyone else who is in touch with him?`},
    {spk:'Caller', t:`Yeah, his sister. I know they talk. But I don't want to put her in the middle.`},
    {spk:'Responder', t:`That makes sense. You don't want her carrying this burden. <span class="meta">(pause)</span> Is there a way she could let you know he's okay?`},
    {spk:'Caller', t:`I don't know. <span class="meta">(pause)</span> Maybe. I guess I could ask her just to tell me if he's all right. Nothing else.`},
    {spk:'Responder', t:`Okay, just whether he's all right. How would that feel, to ask her that?`},
    {spk:'Caller', t:`It actually feels like something I could do I think. <span class="meta">(a small laugh)</span> Beats just staring at my phone all night.`},
    {spk:'Responder', t:`I'm glad we've found something you could actually do instead of staring at the phone. What about in the evenings, when you mentioned the waiting feels hardest? What has helped you get through them so far?`}
  ]}}
 ],
 prompt:`In which part does the responder begin to move toward next steps?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`Part 1, when the responder asks what the argument was about`, correct:false,
   fb:`This question explores the caller's account. It helps the responder understand her concern about whether her son is okay, but does not yet move toward a plan.`},
  {k:'B', t:`Part 2, when the responder summarizes and asks what would help`, correct:true,
   fb:`The responder summarizes, checks understanding and asks whether the caller wants to keep talking or consider what might help. The caller is the one who chooses next steps, allowing the focus to shift with her agreement.`},
  {k:'C', t:`Part 3, when the responder asks about the sister`, correct:false,
   fb:`By Part 3, collaborative problem solving has already begun. The shift occurred in Part 2, when the responder offered a choice and the caller chose to discuss what might help.`}
 ]},

{sec:8, type:'mcq', title:'Transcript 2', explore:true,
 intro:[
  {p:`A caller contacts 9-8-8 in the afternoon. He has declined to give his name or say where he is calling from. He speaks slowly, with long pauses, and has said that he feels down lately and cannot seem to do anything about it.`, lede:true},
  {audio:{label:`Transcript 2`}},
  {h3:`Part 1`},
  {thread:{ch:'Voice call', noCh:true, lines:[
    {spk:'Caller', meta:`(flat, slow)`, t:`I just... can't do anything. I just sit there. Like, the whole day goes by and I don't do anything.`},
    {spk:'Responder', t:`So, the days are going by and you can't seem to get yourself moving. That sounds heavy.`},
    {spk:'Caller', meta:`(a long pause)`, t:`Yeah.`},
    {spk:'Responder', t:`What's it like for you, sitting there as you watch the day go by?`},
    {spk:'Caller', meta:`(pause)`, t:`Honestly, like things are already decided for me. Like I'm going to end up in some place, you know, a facility or a home or whatever. And there's nothing I can do about it.`},
    {spk:'Responder', t:`It feels as though you're going to end up in a facility or home because you can't seem to do anything, and that it's out of your hands. That's a frightening thing to sit with.`},
    {spk:'Caller', meta:`(quietly)`, t:`It is.`}
  ]}},
  {h3:`Part 2`},
  {thread:{ch:'Voice call', noCh:true, lines:[
    {spk:'Responder', t:`Can I ask, is there anyone in your life you can talk to about this? A doctor, or family?`},
    {spk:'Caller', meta:`(pause)`, t:`Not really.`},
    {spk:'Responder', t:`Have you thought about seeing your doctor? They could help you figure out what kind of support might make a difference.`},
    {spk:'Caller', meta:`(long pause)`, t:`I don't even know what support would look like to be honest.`},
    {spk:'Responder', t:`That's okay. There are different kinds. Some people find counselling helps. There are also community programs. If you want, I can give you a number for a service that helps people find them.`},
    {spk:'Caller', meta:`(pause)`, t:`Maybe.`}
  ]}},
  {h3:`Part 3`},
  {thread:{ch:'Voice call', noCh:true, lines:[
    {spk:'Responder', t:`What about things that have helped before, when you've felt low? Is there anything at all?`},
    {spk:'Caller', meta:`(pause)`, t:`Nothing. I don't have anything like that.`},
    {spk:'Responder', t:`Mm-hmm. <span class="meta">(pause)</span> Okay.`},
    {sys:`a long silence`},
    {spk:'Responder', t:`Take your time.`},
    {spk:'Caller', meta:`(pause)`, t:`Yeah.`},
    {sys:`another long silence`},
    {spk:'Responder', t:`I'm here.`}
  ]}},
  {h3:`Part 4`},
  {thread:{ch:'Voice call', noCh:true, lines:[
    {spk:'Caller', meta:`(flat)`, t:`I think I should go.`},
    {spk:'Responder', t:`Okay. Are you sure? You can call back any time.`},
    {spk:'Caller', t:`Yeah. Thanks.`},
    {sys:`The call ends.`}
  ]}}
 ],
 prompt:`Where does the responder first move toward next steps?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`Part 1, when the responder asks what it is like to sit there as the day goes`, correct:false,
   fb:`This question explores the caller's experience and helps him name his fear of ending up in a facility. The responder is still listening to understand what matters to him.`},
  {k:'B', t:`Part 2, when the responder asks whether there is anyone he can talk to`, correct:true,
   fb:`The caller has just named a fear, and the responder moves to supports before exploring it. His replies are short and do not take up the suggestions, but the responder continues offering options.`},
  {k:'C', t:`Part 3, when the responder asks what has helped before`, correct:false,
   fb:`The responder has already moved toward next steps. Asking about coping may be useful, but here it follows suggestions the caller has not engaged with. After his answer, the responder does not explore further.`}
 ]},

/* Second question on Transcript 2: no heading, as the transcript above
   already names it (Module 3 convention). */
{sec:8, type:'mcq', explore:true,
 prompt:`Where does the responder retreat into passive listening?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`Part 2, after the caller says he does not know what support would look like`, correct:false,
   fb:`The caller's uncertainty offers a chance to explore what support would mean to him. Instead, the responder offers more options. The responder is still pushing forward at this point.`},
  {k:'B', t:`Part 3, after the caller says nothing has helped before`, correct:true,
   fb:`The retreat begins after "nothing." The responder relies on acknowledgements and silence without exploring the answer. In the right context, these responses can support someone who is finding words, but here the caller is left to decide how the interaction should continue.`},
  {k:'C', t:`Part 4, when the responder accepts that the caller wants to go`, correct:false,
   fb:`The retreat occurred in Part 3. By Part 4, the caller has decided to leave. Respecting that decision does not explain the earlier loss of direction.`}
 ]},

{sec:8, type:'prose', title:'Activity debrief', blocks:[
  {p:`Both responders began with accurate reflections that helped the caller say more. The difference emerged over the trajectory of the interaction, when they moved toward next steps:`, lede:true},
  {ul:[
    `In <strong>Transcript 1</strong>, the responder stayed with the caller's emotion, summarized and asked which direction she preferred. When she hesitated about involving her daughter, the responder explored the concern and continued working collaboratively with her.`,
    `In <strong>Transcript 2</strong>, the responder moved to supports soon after the caller identified his fear, offered more options when he hesitated and went quiet when he said nothing had helped. The caller then ended the call.`
  ]},
  {panel:{cls:'blue', p:`The second responder's individual statements were well meant. Together, however, they moved away from the caller's fear without helping him decide what might help.`}}
]},

/* ------------- TOPIC 2, RESUMED AFTER THE ACTIVITY ------------- */
{sec:9, type:'prose', title:'Working with an unresolved ending', blocks:[
  {p:`As you learned in Module 1, working with uncertainty is a professional skill that can be developed through practice.`, lede:true},
  {p:`The second call ends without resolution, and as a result, the responder may not ever learn how the caller experienced it. Research with crisis supporters identifies this type of uncertainty about what happens after a difficult interaction as a common stressor.`},
  {key:[`It's important to remember that an unresolved ending does not mean an interaction had no value. This caller identified a fear and received acknowledgement.`]},
  {p:`If you recognize the pattern of retreat in your practice, try to identify where and why it happened and then bring it to your supervisor for a debrief.`},
  {panel:{cls:'blue', p:`The 9-8-8 Safety and Wellbeing Framework can help you navigate supports for the types of interactions that stay with you after they end.`}}
]},

/* ---------------- ACTIVITY: KEEPING THE FOCUS ---------------- */
{sec:10, type:'section', kicker:'Activity', art:'a', tone:'tranquil',
 title:`Keeping the focus`, line:`Practise guiding a hard-to-follow account back to Chantal's experience tonight.`},

{sec:10, type:'prose', title:'How this activity works', blocks:[
  {p:`Some callers can be difficult to follow. They speak quickly, move between parts of a story that is hard to piece together, or become more agitated the longer the story goes on. In these situations, gentle clarification alone often does not slow them down.`, lede:true},
  {p:`The purpose of this activity is to give you an opportunity to practise <strong>assertive empathic focusing</strong>, which means respectfully guiding a hard-to-follow account toward the caller's present experience. This technique can help when clarification draws out more details and the caller becomes increasingly agitated. In this activity, you will practise making this shift while showing that the caller's experience matters.`},
  {p:`Chantal (she/her), a caller in her forties, has been speaking quickly about a conflict with Denise. You cannot tell whether Denise is a coworker, friend or relative. When you asked, "Can I check who Denise is to you?" Chantal replied, "It's complicated, you won't get it," and sped up.`}
]},

/* Continues the briefing. */
{sec:10, type:'prose', blocks:[
  {p:`In this activity, you will:`, lede:true},
  {ul:[
    `listen to what Chantal says at two decision points`,
    `choose what you would say`,
    `notice how she reacts`
  ]},
  {p:`Your choices shape how the conversation unfolds. The scenario is a composite based on a partner-submitted interaction.`},
  {note:`Your answers are not scored. Explore the other options after each choice to compare Chantal's reactions. Screening questions were asked earlier, and she reported no thoughts of suicide.`}
]},

{sec:11, type:'respond', title:'Decision point 1 (Chantal, she/her)', ch:'Voice call',
 audioLabel:`Your response and how Chantal reacts`,
 feedbackCta:`Show the feedback`,
 intro:[
  {audio:{label:`Chantal`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(fast, barely pausing)`, t:`...so then she tells my sister, right, she tells my sister that I said it, which I never said, and my sister believes her, obviously, because they go back, and then Marco gets involved, and now I'm the one who's not invited, and I said to her, I said, you know exactly what you did, and she just...`}
  ]}}
 ],
 prompt:`What do you say?`,
 options:[
  {k:'A', t:`"Sorry, I want to make sure I'm following. Was this before or after she spoke to your sister? Who is Marco, and how does he fit in with Denise and your sister?"`,
   reply:[{spk:'Caller', meta:`(faster)`, t:`Marco is...okay, so Marco is my sister's partner, but he used to be friends with Denise's brother, which is a whole other thing, and that was years ago, before any of this, and honestly it doesn't matter because the point is...`}]},
  {k:'B', t:`"Chantal, I'm going to stop you there for a second, because I want to get this right and I can hear you're carrying a lot at once. Let's slow down for a moment. Before we get into the details, how are you doing tonight?"`,
   reply:[{spk:'Caller', meta:`(stops)`, t:`...Tonight? <span class="meta">(a breath)</span> Tonight I'm a mess, honestly. I haven't stopped shaking since the phone call this afternoon.`}]},
  {k:'C', t:`Say nothing and let her continue. She may slow down on her own once she has told the whole story, and interrupting could feel dismissive.`, say:'',
   reply:[{sys:`Chantal talks for another two minutes. The story adds three more people and goes back several years. Her voice gets louder.`},
          {spk:'Caller', meta:`(frustrated)`, t:`Are you even following this? Ugh, nobody gets this.`}]}
 ],
 closing:`Further questions about the sequence and people draw Chantal into more detail, and she speeds up. After a silent wait, she asks whether you are even following, which may suggest she does not feel heard. The strongest response interrupts respectfully, explains why and asks how she is doing tonight. This shifts the focus to her present experience without dismissing its importance.`},

{sec:11, type:'respond', title:'Decision point 2 (Chantal, she/her)', ch:'Voice call',
 audioLabel:`Your response and how Chantal reacts`,
 feedbackCta:`Show the feedback`,
 intro:[
  {audio:{label:`Chantal`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(slower, still tight)`, t:`Like, I'm shaking, I'm not sleeping. I keep going over it, every single conversation. I don't even think I've eaten since yesterday. And I just feel like everyone's made up their minds that I'm the problem but nobody will say it to my face.`}
  ]}}
 ],
 prompt:`What do you say?`,
 options:[
  {k:'A', t:`"Why do you think they've all decided you're the problem? Has something like this happened before, with your sister or with Denise, or is this the first time?"`,
   reply:[{spk:'Caller', meta:`(defensive)`, t:`Why do I think? Because that's what they do. And yes, it has, actually, in 2019, when my sister...`}]},
  {k:'B', t:`"You're not sleeping or eating, you keep going over it, and you feel like everyone's decided you're the problem without saying it to you. That's a lot to hold. What's been the hardest part of today?"`,
   reply:[{spk:'Caller', meta:`(a long breath)`, t:`The hardest part of today? <span class="meta">(pause)</span> I think it was hanging up the phone this afternoon and realizing there ain't nobody I could call about it. That's why I called you I guess.`}]},
  {k:'C', t:`"That sounds really isolating. Have you tried talking to your sister directly about how you're feeling? Sometimes a one-on-one conversation can clear things up, even after something like this."`,
   reply:[{spk:'Caller', meta:`(flat)`, t:`Talk to my sister. <span class="meta">(pause)</span> So you haven't been listening either. <span class="meta">(louder)</span> I just told you she believes Denise.`}]}
 ],
 closing:`The strongest response summarizes Chantal's present experience and asks one open question. The why-question may prompt her to defend her feelings and return to the history. Suggesting she speak to her sister overlooks what she has already said. If she returns to the details, you should acknowledge their importance and gently refocus on how she is doing tonight.`},

{sec:11, type:'prose', title:'Activity debrief', blocks:[
  {p:`As discussed in previous modules, it's important to use the caller's response to judge whether a clarification is helping. With Chantal, questions about details were followed by faster speech and more detail. What seemed to help in this context was:`, lede:true},
  {ul:[
    `interrupting respectfully, explaining why and asking about her experience tonight`,
    `summarizing her present experience and asking one open question`
  ]},
  {p:`If Chantal returns to the story, acknowledge that it matters and gently return to how she is doing tonight. Keep any offer to revisit the details realistic. A real caller may respond differently, so continue to use her response as your guide.`},
  {panel:{cls:'blue', p:`The aim is to understand the person's distress without becoming lost in the details. You will use this same judgement with Sam in the culminating simulation.`}}
]},

{sec:12, type:'section', num:'03', kicker:'Topic 3', art:'c',
 title:`Culminating simulation`, line:`How to bring the skills from this course together in two simulated interactions`},

{sec:12, type:'prose', blocks:[
  {p:`In this topic, you will apply your skills in two simulated interactions that bring together:`, lede:true},
  {ul:[
    `the supportive, collaborative approach from Module 2`,
    `the trauma-informed and culturally humble lens from Module 3`,
    `building connection from Module 4`,
    `listening and questioning from Module 5`,
    `reflection and validation from Module 6`,
    `the self-regulation and timing skills from this module`
  ]}
]},

/* Continues the topic opening. */
{sec:12, type:'prose', blocks:[
  {p:`Each interaction is designed to create a different kind of pressure:`, lede:true},
  {cards:{cols:2, items:[
    {t:`Sam is angry and escalating.`},
    {t:`Riley is quiet and slow to reply.`}
  ]}},
  {p:`With Sam, the goal is to practise staying steady and de-escalating. With Riley, the idea is to practise remaining present without rushing. We recommend completing both simulations if you can, in either order.`}
]},

{sec:12, type:'prose', title:'How the simulations work', blocks:[
  {p:`You are the responder. At each decision point, your task is to`, lede:true},
  {ol:[
    `listen to or read what the person says`,
    `then choose your reply`
  ]},
  {p:`Your choices affect their response and the decisions that follow. Some choices can lead to an early ending. If this happens, the end screen explains what the responder does next and lets you revisit the decision.`}
]},

/* Continues "How the simulations work". */
{sec:12, type:'prose', blocks:[
  {p:`After each simulation, you will see feedback with notes on all six decision points, as well as a transcript of your interaction. The notes describe one way each interaction could unfold, and a real interaction may unfold differently. Be sure to keep the transcript for Topic 4. We recommend exploring more than one route, including opportunities to repair a strained interaction. Throughout the interaction, practise noticing when connection weakens and choosing how to restore it.`, lede:true},
  {note:`Completed routes end where collaborative safety planning begins. The SASP course covers suicide risk assessment, safety planning and emergency intervention; these are not practised here. Both interactions include the required screening questions. You will practise asking them clearly and in context. These simulations focus on the relational aspects of the approach. In practice, follow the applicable SASP assessment and safety procedures when suicidal thoughts are disclosed. Empathy and safety procedures work together.`}
]},

/* ---------------- SIMULATION A: SAM ---------------- */
{sec:13, type:'section', kicker:'Simulation A', art:'b', tone:'tranquil',
 title:`A call with Sam`, line:`Stay steady and de-escalate in a call with an angry, escalating caller.`},

{sec:13, type:'prose', title:'Before you begin', blocks:[
  {p:`It is shortly after midnight, and you answer a call from Sam (he/him). In Module 1, he had lost his job and housing in the same month and spent weeks hearing scripted responses from services. Several weeks have passed since then. You do not yet know what has happened in the meantime.`, lede:true},
  {p:`Your choices shape how the conversation unfolds. Listen to each clip, choose what you say and notice how Sam reacts.`}
]},

/* The simulations run in their own window (`immersive`). Decision points are
   named in the transcript only (`dp`), so nothing on screen gives away what
   each one tests. */
{sec:14, type:'convo', immersive:true, ch:'Voice call', audio:true,
 person:{name:'Sam', init:'S', sub:'he/him · Voice'},
 audioLabel:SAM_REACTS,
 start:'s1', restart:`Start the call again`,
 transcript:true, transcriptTitle:`Key Responder Skills, Module 7: A call with Sam`, transcriptFile:`Module7_Sam_transcript.txt`,
 nodes:SAM_NODES},

{sec:14, type:'prose', title:'Looking back at the call with Sam', blocks:[
  {acc:[
    {q:`Answering the call`, a:`Sam opened by saying he already knew how the call would go. Several questions at once, or screening with no acknowledgement of what he had just said, may have come across as the script he was expecting. A brief, calm reflection gave him room to say more. Asking about suicide early is required, and it was not the problem here. In this simulation, a brief acknowledgement comes first and the question follows within minutes.`},
    {q:`Sam turns on you`, a:`Defending the service risked reinforcing Sam's distrust, while silence may have come across as absence. The strongest response validated his anger, acknowledged the limits of the role and offered attentive listening. When the call was strained, repair required acknowledging the rushed opening and changing the approach. Returning immediately to questions or dwelling on the apology kept the focus away from Sam.`},
    {q:`Asking about suicide`, a:`The negatively framed question invited a reassuring no. The hedged question left Sam to interpret what the responder meant. A direct question connected to his words made the purpose clear. On every route, the responder came back to the question later in the call, and Sam answered it. As in Module 5, both question framing and connection can shape a person's willingness to answer. A first "no," or no answer at all, does not end your responsibility to ask.`},
    {q:`Sam's anger turns to grief`, a:`Moving to solutions risked leaving Sam feeling managed; silence may have left him feeling alone. A specific, tentative reflection acknowledged the loss and the distress he described in his experiences with services. This applied the Module 3 lens and Module 6 reflection skills. The responder then returned to the question about suicide, and Sam answered it.`},
    {q:`Sam pushes back`, a:`His uncertainty about what he wanted called for exploration. The list of steps moved too quickly, and pressure to involve his brother was met with pushback. Leaving the decision with Sam and asking an open question gave him room to describe the Sunday calls. When the call was strained, repair meant acknowledging the pressure and restoring choice without leaving him to manage the interaction.`},
    {q:`Sam's strengths and next steps`, a:`Reflecting Sam's persistence and his brother's contact acknowledged strengths without adding praise. Presenting a plan as a form risked repeating his experience with services. Closing warmly would have left his thoughts of suicide unaddressed. The strongest response explained why a plan was needed, proposed building it from what Sam had shared and invited his input.`}
  ]},
  {panel:{cls:'blue', p:`These notes describe one way the call could unfold. A real interaction may unfold differently. If your interaction ended early, review the end screen and try another response at the decision where it changed direction. If your choices maintained connection throughout, try replaying the simulation with a less helpful opening to see what happens. Be sure to explore the repair options at decision points 2 and 5, as well.`}}
]},

/* ---------------- SIMULATION B: RILEY ---------------- */
{sec:15, type:'section', kicker:'Simulation B', art:'e', tone:'tranquil',
 title:`A text interaction with Riley`, line:`Remain present without rushing in a text interaction with a quiet texter.`},

{sec:15, type:'prose', title:'Before you begin', blocks:[
  {p:`It is after eleven on a school night. Riley (they/them) has texted 9-8-8. You saw their opening messages in Module 1; here, you will follow the interaction further. As the responder, at this point you do not yet know what happened or what name they use.`, lede:true},
  {p:`Your choices shape how the conversation unfolds. Read each message, choose what you send and notice how Riley reacts. Pay attention to the time between messages as well as to their words.`}
]},

/* Riley gives their name at decision point 2, but the script names them in
   its prompts throughout and the briefing introduces them, so the card
   carries the name from the start. */
{sec:16, type:'convo', immersive:true, ch:'Text', startTime:'11:12 PM',
 person:{name:'Riley', init:'R', sub:'they/them · Text'},
 start:'r1', restart:`Start the conversation again`,
 transcript:true, transcriptTitle:`Key Responder Skills, Module 7: A text interaction with Riley`, transcriptFile:`Module7_Riley_transcript.txt`,
 nodes:RILEY_NODES},

{sec:16, type:'prose', title:'Looking back at the interaction with Riley', blocks:[
  {acc:[
    {q:`The first message`, a:`Several questions at once can create pressure, while screening with no welcome may come across as a form. The strongest opening welcomed Riley and gave them time to begin. Asking about suicide early is required, and it was not the problem here. In this simulation, the question follows a few messages later, once Riley has begun to talk.`},
    {q:`The silence`, a:`After a difficult disclosure, two minutes without a reply may tempt you to ask another question or assume Riley has left. A brief presence message allowed time to type. If the opening was rushed, acknowledging that pressure without asking for more gave Riley room to return. More questions risked keeping them distant; asking whether they were okay may have added pressure to respond.`},
    {q:`What Riley tells you`, a:`Generic reassurance made a claim the responder could not know. Repeating details alone did not convey understanding. A tailored, tentative reflection connected the details to what seemed painful. Riley's longer, quicker replies then suggested increased engagement.`},
    {q:`"Everyone would be better off"`, a:`Check what the person means by asking directly about suicide. Several questions at once were followed by "forget i said anything"; shifting to coping was followed by "nothing really." The direct, contextual question was followed by "idk, maybe" and reluctance to continue. The responder acknowledged that this part was hard, explained why they were asking and came back to the question a few messages later. An uncertain answer still needs exploration.`},
    {q:`"This isn't helping"`, a:`Pleading disputed Riley's experience. Closing immediately would have left "maybe everyone would be better off" unexplored. The strongest reply acknowledged their doubt, named what Riley had said about everyone being better off and respected their choice while offering continued support. When the interaction was strained, a specific apology and reduced pressure gave Riley room to stay. Asking Riley to direct the repair placed more responsibility on them. In this simulation, they then stopped replying.`},
    {q:`"Nothing helps with my dad"`, a:`Drawing could not change Riley's dad. Recommending it as a solution missed their point, while presenting a plan as required questions may have come across as procedural. Closing would have left no plan. The strongest reply acknowledged the limit of drawing, explained why a plan was needed and invited Riley to shape it in their own words.`}
  ]},
  {panel:{cls:'blue', p:`These notes describe one way the interaction could unfold. A real interaction may unfold differently. If the interaction ended early, review the end screen and retry the decision where it changed direction. If you maintained connection throughout, try replaying the simulation with a less helpful opening and explore the repairs at decision points 2 and 5.`}}
]},

/* ---------------- TOPIC 4 ---------------- */
{sec:17, type:'section', num:'04', kicker:'Topic 4', art:'d',
 title:`Reflecting on your practice`, line:`How to assess your simulation decisions and choose a focus for live practice`},

{sec:17, type:'prose', blocks:[
  {p:`In this final section of the course, you will take a moment to reflect on your learning journey with the simulations. Each of the simulations had six decision points. You will review the choices you made using the behavioural rubric used by supervisors in the 9-8-8 network. The idea here is for you to use it to identify one skill you want to develop in live practice.`, lede:true},
  {note:`Self-assessment and using supervision feedback are competencies in the Canadian Crisis Line Response Competency Framework. The 9-8-8 Safety and Wellbeing Framework also identifies reflective practice as a way to build self-awareness.`}
]},

{sec:17, type:'prose', title:'The behavioural rubric', blocks:[
  {p:`The following rubric describes four areas of practice through observable behaviours. The purpose of using it here is to provide a framework for you to assess your own performance as a responder.`, lede:true},
  {p:`Each of the four areas in the rubric corresponds to skills you practised in this course. They are described by what they look like in an interaction, rather than by a checklist of techniques. As you learned in this course, it is possible to use many of the right techniques and still leave a person feeling unheard. This rubric is intended to focus on what you did to help the person feel heard.`},
  {acc:[
    {q:`Maintaining the approach (Modules 2 and 3)`, a:`You stay supportive, collaborative and non-judgmental, including and especially under pressure. You do not defend the service, argue with the person's experience, prescribe solutions or match the person's intensity. You treat the barriers and injustices the person describes as real sources of distress.`},
    {q:`Reflecting accurately (Modules 4 to 6)`, a:`Your reflections are specific to what the person said and felt, offered tentatively and adjusted when the person corrects them. They include strengths the person mentions, without turning them into praise.`},
    {q:`Framing questions effectively (Module 5)`, a:`Your questions come one at a time and invite honest answers. The direct questions about suicide are asked early, in plain words connected to what the person has said, and ambiguous statements are checked rather than assumed.`},
    {q:`Managing the trajectory (Module 5 and this module)`, a:`You listen before discussing next steps, explain why you are shifting focus, invite the person's input and remain collaborative when an idea does not fit. You explore the person's response rather than pushing the idea or retreating into passive listening.`}
  ]}
]},

 title:`What, So what, Now what`, line:`Connect a moment from the simulations to a goal for live practice.`},

{sec:20, type:'prose', title:'How this activity works', blocks:[
  {p:`As the course comes to a close, this final reflection asks you to connect what you learned to how you will use it in practice. Use these three questions to connect your simulation experience with a goal for live practice, and for behavioural changes you want to see in your own work. Answer in your workbook, and be sure to draw on your self-assessment and the signs of activation you noticed in Topic 1.`, lede:true}
]},

 ],

 ]},

/* ---------------- LIVE PRACTICE AND REFERENCES ---------------- */
{sec:22, type:'section', kicker:'Wrapping up', art:'c', tone:'tranquil',
 title:`Live practice and references`, line:`Priorities for live practice, and the references for this module.`},

{sec:22, type:'prose', title:'Live-practice hand-off', blocks:[
  {p:`In this module, you practised noticing activation, supporting de-escalation, judging when to discuss next steps and keeping an interaction focused. You also brought the course skills together in voice and text simulations. Live practice with feedback will help you develop these skills further and use them under pressure. The three priorities you should focus on are:`, lede:true},
  {instr:`Select each priority to learn more.`},
  {reveal:{items:[
    {t:`Regulating under live pressure`, d:`In synchronous practice or supervised role-play, practise steadying yourself while continuing to engage an agitated caller. Ask the role-player how your voice sounded and whether your delivery helped them feel heard.`},
    {t:`Timing the move toward next steps`, d:`Review a recording or transcript of a practice interaction with your supervisor or mentor. Identify the cues that informed your timing and whether you maintained collaboration when the person pushed back.`},
    {t:`De-escalating in text`, d:`Riley's interaction required patience with silence. Use live text practice, where available, to judge when to wait and when a brief presence message helps.`}
  ]}},
  {p:`Bring your rubric self-assessment and "now what" goal to supervision. Revisit your workbook notes, including the Module 1 readiness reflection and Module 3 reflexivity notes, to see how your understanding has developed.`},
  {panel:{cls:'blue', p:`You have now completed all seven modules of Key Responder Skills. Continue practising the skills that help callers and texters feel heard: staying present, checking your understanding and working with the person. Thank you for the care you bring to this work.`}}
]},

    else if(b.cards) root.append(cardsEl(b.cards));
    else if(b.flip) root.append(flipEl(b.flip));
    else if(b.tabs) root.append(tabsEl(b.tabs, b.select));

/* Carousel: one item at a time, with previous/next, a counter and dots.
   Items are strings (set as quotes when `quote:true`) or {h, p, blocks}.
   Slides share one grid cell, so the carousel keeps the height of the
   tallest and the page does not jump. */
function carouselEl(c){
  const wrap=el('div','carousel'); wrap.setAttribute('role','group');
  wrap.setAttribute('aria-roledescription','carousel');
  if(c.label) wrap.setAttribute('aria-label',c.label);
  const track=el('div','car-track'); track.setAttribute('aria-live','polite');
  const n=c.items.length;
  const slides=c.items.map((it,i)=>{
    const sl=el('div','car-slide'); sl.setAttribute('role','group');
    sl.setAttribute('aria-roledescription','slide'); sl.setAttribute('aria-label',(i+1)+' of '+n);
    if(typeof it==='string') sl.append(el('p',c.quote?'car-quote':null,H(it)));
    else { if(it.h) sl.append(el('h4',null,H(it.h))); if(it.p) sl.append(el('p',null,H(it.p))); if(it.blocks) blocks(it.blocks,sl); }
    track.append(sl); return sl;
  });
  const nav=el('div','car-nav');
  const prev=el('button','btn ghost small','Previous'), next=el('button','btn ghost small','Next');
  const dots=el('div','car-dots'), count=el('span','count');

  let cur=0;

  };

}
